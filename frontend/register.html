<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="./css/style_stregister.css">
    <link href="https://fonts.googleapis.com/css2?family=Vampiro+One&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Botão único usando apenas a classe -->
    <button class="theme-toggle-btn">🌙</button>

    <main class="register-wrapper">
        <header class="register_info">
            <h1>Criar Conta</h1>
            <p>Preencha os dados para se cadastrar no sistema</p>
            <span>Já possui conta?</span>
            <a href="./index.html">Voltar para o Login</a>
        </header>
        
        <section class="register-card">
            <form id="registerForm">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Digite seu nome" id="nome">
                </div>
                
                <div class="input-group">
                    <label for="e-mail">E-mail</label>
                    <input id="e-mail" type="text" placeholder="Digite seu e-mail" id="e-mail">
                </div>
                
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Digite sua senha" id="senha">
                </div>
                
                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" placeholder="Repita sua senha" id="Confirmar" >
                </div>
                
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <!--Criando o Modal Global -->

    <div id="customAlert" class="alert-overlay">
        <div class="alert-box">
            <h3 id="alertTitle">Aviso</h3>
            <P id="alertMessage">mensagem</P>
            <button type="button" id="btnAlertConfirm">
                Ok , ENTENDI
            </button>
        </div>
    </div>
        

   <!-- Script do tema importado no final do body -->
    
    <script src="./js/theme.js"></script>
    <script src="./js/register.js"></script>
    <script src="./js/modal.js"></script>
</html>
