<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Systen</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<!-- div principal do login - A classe login-container é usada no CSS  -->
    <div class="login-container">

<!-- Titulo principal da pagina  -->
        <h1>Login</h1> 

<!-- Paragrafo para textos auxiliares de instuções para usários -->
    <p> Acesse sua Conta </p>

    <form=>
<!-- Éa div que a label e o imput -->
        <div class="imput-group">

<!-- Texto que descreve o nosso campo -->
            <label for="e-mail">E-mail</label>
            
<!-- Campo de entrada do e-mail -->
            <input id="e-mail=" type="text" placeholder="Digite seu e-mail">

            <label for="senha">Senha</label>

            <input id="senha=" type="password" placeholder="Digite sua senha">

            <button type="submit">Entrar</button>

        </div>

    </form>

    <div class="footer">
        <span>Não tem Conta?</span>
        <a href="#">Criar Conta</a>
    </div>
     
    </div>
</body>
</html>
